<title>Railyard Rush</title>
<style>
:root{--ink:#14213d;--y:#ffd23f;--o:#ff7a1a;--p:#ff3d7f;--b:#2ec4ff;--g:#3ddc84;--panel:rgba(18,24,48,.92);--bg:#0b1020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1020}}
:root[data-theme="dark"]{--bg:#0b1020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:10}
[hidden]{display:none!important}
.logo{font-size:clamp(40px,9vw,84px);font-weight:900;letter-spacing:1px;line-height:.9;text-align:center;transform:rotate(-4deg);
 color:var(--y);text-shadow:0 4px 0 #c2410c,0 8px 0 #7c2d12,0 12px 18px rgba(0,0,0,.5);-webkit-text-stroke:2px #3b1205}
.logo small{display:block;font-size:.55em;color:var(--b);text-shadow:0 4px 0 #0369a1,0 8px 0 #0c2d48,0 12px 18px rgba(0,0,0,.5);-webkit-text-stroke:2px #04263d}
.btn{font:inherit;font-weight:900;font-size:20px;letter-spacing:.5px;color:#fff;border:none;border-radius:14px;padding:12px 22px;min-width:180px;cursor:pointer;
 background:linear-gradient(#ff9a3c,#ff6a00);box-shadow:0 5px 0 #a33f00,0 8px 14px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a33f00}
.btn.blue{background:linear-gradient(#4fd2ff,#1593d9);box-shadow:0 5px 0 #0b5a8a,0 8px 14px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#5df29a,#1fb866);box-shadow:0 5px 0 #0d6b38,0 8px 14px rgba(0,0,0,.4)}
.btn.pink{background:linear-gradient(#ff6fa3,#e0246a);box-shadow:0 5px 0 #8a0f3d,0 8px 14px rgba(0,0,0,.4)}
.btn.grey{background:linear-gradient(#8b95b3,#5c6688);box-shadow:0 5px 0 #353d58,0 8px 14px rgba(0,0,0,.4)}
.btn.sm{font-size:15px;padding:8px 14px;min-width:0;border-radius:10px}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.panel{background:var(--panel);border:3px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel h2{margin:0 0 10px;font-size:26px;text-align:center;color:var(--y);text-shadow:0 3px 0 #7c2d12}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tabs button{font:inherit;font-weight:800;border:none;border-radius:10px;padding:7px 12px;background:#2a3358;color:#cfd6f5;cursor:pointer}
.tabs button.on{background:var(--b);color:#04263d}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#222a4d;border-radius:14px;padding:10px;text-align:center;border:2px solid transparent}
.item.sel{border-color:var(--g)}
.item .sw{height:56px;border-radius:10px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:30px}
.item b{display:block;font-size:15px}
.item small{display:block;color:#aab3d6;font-size:12px;min-height:30px}
.pips{display:flex;gap:3px;justify-content:center;margin:4px 0}
.pips i{width:14px;height:8px;border-radius:3px;background:#3a4470}.pips i.on{background:var(--y)}
.coinpill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:99px;font-weight:900;font-size:18px}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23f 45%,#d99500);box-shadow:inset 0 0 0 2px #b97800;display:inline-block}
#topbar{position:fixed;top:12px;right:12px;z-index:11;display:flex;gap:8px}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud .score{position:absolute;top:10px;right:14px;text-align:right;font-weight:900;font-size:clamp(26px,6vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.5)}
#hud .score .mult{display:inline-block;background:var(--p);font-size:.55em;padding:2px 8px;border-radius:8px;vertical-align:middle;margin-left:6px}
#hud .coins{position:absolute;top:62px;right:14px}
#hud .pw{position:absolute;left:12px;top:60px;display:flex;flex-direction:column;gap:6px}
#hud .pw div{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);border-radius:10px;padding:4px 8px;font-weight:800;font-size:14px}
#hud .pw .bar{width:70px;height:7px;background:#333a5c;border-radius:4px;overflow:hidden}#hud .pw .bar i{display:block;height:100%;background:var(--y)}
#pauseBtn{position:fixed;top:10px;left:12px;z-index:6;width:44px;height:44px;border-radius:12px;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:20px;font-weight:900;cursor:pointer}
#boardBtn{position:fixed;bottom:18px;right:16px;z-index:6;width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:linear-gradient(#4fd2ff,#1593d9);color:#fff;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#boardBtn span{display:block;font-size:22px}
#toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:12;font-weight:900;font-size:clamp(20px,5vw,32px);color:var(--y);text-shadow:0 3px 0 #7c2d12,0 0 16px rgba(0,0,0,.6);pointer-events:none;text-align:center;transition:opacity .3s}
.mis{display:flex;flex-direction:column;gap:8px}
.mis div{background:#222a4d;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
.mis div.done{background:#1d5c3c}
.mis .pg{color:var(--y);white-space:nowrap}
.big{font-size:44px;font-weight:900;color:var(--y);text-shadow:0 4px 0 #7c2d12;text-align:center}
.stat{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.hint{color:#dfe5ff;background:rgba(10,14,32,.55);border-radius:10px;padding:6px 12px;font-size:14px;text-align:center;max-width:520px;line-height:1.5}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:700;gap:10px}
.set select,.set input{font:inherit;background:#2a3358;color:#fff;border:none;border-radius:8px;padding:6px 8px}
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:var(--y);text-shadow:0 6px 0 #7c2d12;z-index:12;pointer-events:none}
#tapHint{position:fixed;bottom:14%;left:0;right:0;text-align:center;font-weight:900;font-size:22px;z-index:11;animation:pulse 1.1s infinite;text-shadow:0 3px 0 rgba(0,0,0,.6);pointer-events:none}
@keyframes pulse{50%{opacity:.35}}
@media (max-aspect-ratio:11/10){#menu{justify-content:flex-start;padding-top:9vh}}
@media (pointer:coarse){.kbhint{display:none}}
#warn{position:fixed;top:45%;font-size:46px;z-index:6;pointer-events:none;filter:drop-shadow(0 0 8px red)}
</style>

</div>

 <div class="tabs"><button data-t="crew" class="on">Crew</button><button data-t="boards">Boards</button><button data-t="up">Upgrades</button><button data-t="items">Items</button></div>

<div class="ov" id="settings" hidden><div class="panel"><h2>Settings</h2>
 <div class="set">Graphics<select id="sGfx"><option value="auto">Auto</option><option value="low">Low</option><option value="high">High</option></select></div>
 <div class="set">Sound effects<input type="range" id="sSfx" min="0" max="1" step="0.05"></div>
 <div class="set">Music<input type="range" id="sMus" min="0" max="1" step="0.05"></div>

<div class="ov" id="saveme" hidden><div class="panel" style="max-width:340px;text-align:center"><h2>Save me!</h2>
 <div class="big" id="smTimer">5</div><div class="hint">Use keys to keep running</div>
 <div class="row" style="margin-top:10px"><button class="btn green" id="bSaveMe">🔑 x<span id="smCost">1</span></button><button class="btn grey" id="bNoSave">No thanks</button></div></div></div>
<div class="ov" id="over" hidden><div class="panel" style="max-width:380px"><h2 id="ovTitle">Busted!</h2>

<div id="tapHint" hidden>TAP TO RUN</div>
<div id="fps" style="position:fixed;bottom:6px;left:8px;z-index:20;font:12px monospace;color:#0f0" hidden></div>
<script>
// ---------- math ----------
const M4={
 id(){const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m},
 persp(fov,asp,n,f){const t=1/Math.tan(fov/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m},
 look(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2],l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0,xy,yy,zy,0,xz,yz,zz,0,-(xx*e[0]+xy*e[1]+xz*e[2]),-(yx*e[0]+yy*e[1]+yz*e[2]),-(zx*e[0]+zy*e[1]+zz*e[2]),1])},
 mul(a,b,o){o=o||new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s}return o},
 trs(x,y,z,ry,rx,rz,s,o){// translate * Ry * Rx * Rz * scale
  o=o||new Float32Array(16);s=s||1;const cy=Math.cos(ry||0),sy=Math.sin(ry||0),cx=Math.cos(rx||0),sx=Math.sin(rx||0),cz=Math.cos(rz||0),sz=Math.sin(rz||0);
  // R = Ry*Rx*Rz
  const r00=cy*cz+sy*sx*sz,r01=-cy*sz+sy*sx*cz,r02=sy*cx,r10=cx*sz,r11=cx*cz,r12=-sx,r20=-sy*cz+cy*sx*sz,r21=sy*sz+cy*sx*cz,r22=cy*cx;
  o[0]=r00*s;o[1]=r10*s;o[2]=r20*s;o[3]=0;o[4]=r01*s;o[5]=r11*s;o[6]=r21*s;o[7]=0;o[8]=r02*s;o[9]=r12*s;o[10]=r22*s;o[11]=0;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o}
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
let _seed=12345;const rnd=()=>{_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296};
const rint=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];
function hex(c){return[(c>>16&255)/255,(c>>8&255)/255,(c&255)/255]}

// ---------- GL ----------
const cv=document.getElementById('cv');
const gl=cv.getContext('webgl2',{antialias:false,powerPreference:'high-performance',alpha:false});
if(!gl){document.body.innerHTML='<div style="padding:40px;font:20px sans-serif;color:#fff">WebGL2 is not available on this device/browser.</div>';throw new Error('no webgl2')}
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)+src);return s}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'aP');gl.bindAttribLocation(p,1,'aN');gl.bindAttribLocation(p,2,'aC');gl.bindAttribLocation(p,3,'aU');gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name)}return{p,u}}

const VS=`#version 300 es
layout(location=0)in vec3 aP;layout(location=1)in vec3 aN;layout(location=2)in vec4 aC;layout(location=3)in vec2 aU;
uniform mat4 uVP,uM;uniform vec3 uCam;uniform vec2 uBend;
out vec3 vN;out vec4 vC;out vec2 vU;out float vD;out vec3 vW;
void main(){vec4 w=uM*vec4(aP,1.);float dz=min(w.z-uCam.z,0.);w.y-=uBend.x*dz*dz;w.x+=uBend.y*dz*dz;
 vW=w.xyz;vN=mat3(uM)*aN;vC=aC;vU=aU;gl_Position=uVP*w;vD=length(w.xyz-uCam);}`;
const FS=`#version 300 es
precision mediump float;in vec3 vN;in vec4 vC;in vec2 vU;in float vD;in vec3 vW;
uniform sampler2D uT;uniform vec4 uTint;uniform vec3 uSun,uSunC,uSky,uGnd,uFog,uEm;uniform float uFogD,uUnlit,uNight,uFlash;
out vec4 o;
void main(){vec4 t=texture(uT,vU);vec3 n=normalize(vN);
 vec3 base= t.a>.8 ? vC.rgb*uTint.rgb*t.rgb : t.rgb;
 vec3 amb=mix(uGnd,uSky,n.y*.5+.5);float d=max(dot(n,uSun),0.);
 vec3 c=base*(amb+uSunC*d);
 c=mix(c,base,uUnlit);
 if(t.a<.45)c+=t.rgb*uEm*2.2+uEm*.25;
 c+=uFlash*vec3(1.,.9,.6);
 float f=1.-exp(-vD*uFogD);f=f*f;c=mix(c,uFog,clamp(f,0.,1.));
 o=vec4(c,1.);}`;
const SKYVS=`#version 300 es
layout(location=0)in vec3 aP;out vec2 vP;void main(){vP=aP.xy;gl_Position=vec4(aP.xy,.9999,1.);}`;
const SKYFS=`#version 300 es
precision mediump float;in vec2 vP;uniform vec3 uTop,uHor,uSunC;uniform vec2 uSunP;uniform float uStars,uAsp;out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){float y=vP.y*.5+.5;vec3 c=mix(uHor,uTop,smoothstep(.35,1.,y));
 vec2 q=vec2((vP.x-uSunP.x)*uAsp,vP.y-uSunP.y);float sd=length(q);c+=uSunC*(smoothstep(.09,.07,sd)*1.2+.35*exp(-sd*5.));
 if(uStars>0.){vec2 g=floor(vec2(vP.x*uAsp,vP.y)*90.);float s=h(g);c+=uStars*step(.992,s)*smoothstep(.45,.8,y)*vec3(1.);}
 o=vec4(c,1.);}`;
const P=prog(VS,FS), SKY=prog(SKYVS,SKYFS);
const skyBuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,skyBuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,0,3,-1,0,-1,3,0]),gl.STATIC_DRAW);
const skyVAO=gl.createVertexArray();gl.bindVertexArray(skyVAO);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.bindVertexArray(null);

// ---------- mesh builder ----------
// UV regions in a 1024 atlas (pixels): [x,y,w,h]
const AT=1024;const R={WHITE:[1,1,6,6]};
class MB{constructor(){this.p=[];this.n=[];this.c=[];this.u=[];this.i=[];}
 vtx(x,y,z,nx,ny,nz,c,u,v){this.p.push(x,y,z);this.n.push(nx,ny,nz);this.c.push(c[0],c[1],c[2],1);this.u.push(u,v);return this.p.length/3-1}
 quad(a,b,cc,d,nrm,col,reg,flip){// a,b,c,d corners CCW, reg uv rect
  reg=reg||R.WHITE;const u0=reg[0]/AT,v0=reg[1]/AT,u1=(reg[0]+reg[2])/AT,v1=(reg[1]+reg[3])/AT;
  const uv=flip?[[u1,v1],[u0,v1],[u0,v0],[u1,v0]]:[[u0,v1],[u1,v1],[u1,v0],[u0,v0]];
  const s=this.p.length/3;[a,b,cc,d].forEach((q,k)=>this.vtx(q[0],q[1],q[2],nrm[0],nrm[1],nrm[2],col,uv[k][0],uv[k][1]));
  this.i.push(s,s+1,s+2,s,s+2,s+3)}
 // box centered at x,z with bottom y; tex: {side,front,back,top} regions; side = +-x faces (u along -z)
 box(x,y,z,w,h,d,col,tex,ry){tex=tex||{};col=typeof col=='number'?hex(col):col;const hw=w/2,hd=d/2;
  const P=(px,py,pz)=>{if(ry){const c=Math.cos(ry),s=Math.sin(ry);return[x+px*c+pz*s,y+py,z-px*s+pz*c]}return[x+px,y+py,z+pz]};
  const N=(nx,ny,nz)=>{if(ry){const c=Math.cos(ry),s=Math.sin(ry);return[nx*c+nz*s,ny,-nx*s+nz*c]}return[nx,ny,nz]};
  this.quad(P(-hw,0,hd),P(hw,0,hd),P(hw,h,hd),P(-hw,h,hd),N(0,0,1),col,tex.back);// +z (back, faces camera)
  this.quad(P(hw,0,-hd),P(-hw,0,-hd),P(-hw,h,-hd),P(hw,h,-hd),N(0,0,-1),col,tex.front);
  this.quad(P(hw,0,hd),P(hw,0,-hd),P(hw,h,-hd),P(hw,h,hd),N(1,0,0),col,tex.side);
  this.quad(P(-hw,0,-hd),P(-hw,0,hd),P(-hw,h,hd),P(-hw,h,-hd),N(-1,0,0),col,tex.side2||tex.side);
  this.quad(P(-hw,h,hd),P(hw,h,hd),P(hw,h,-hd),P(-hw,h,-hd),N(0,1,0),col,tex.top);
  if(!tex.noBottom)this.quad(P(-hw,0,-hd),P(hw,0,-hd),P(hw,0,hd),P(-hw,0,hd),N(0,-1,0),col);return this}
 // cylinder: axis 'x'|'y'|'z', center (x,y,z) (y = center for x/z axis, bottom for y axis)
 cyl(x,y,z,r,len,seg,col,axis,r2){col=typeof col=='number'?hex(col):col;r2=r2==null?r:r2;const L=len/2;

const W={trains:[],obs:[],coins:[],pups:[],genZ:-30,lastPup:-200,lastBox:-150};

function laneBusy(l,zFar,zNear){for(const t of W.trains)if(t.lane==l&&t.v&&t.zf<zNear+5)return true;return false}
function addTrain(l,zNear,cars,opt){opt=opt||{};const len=cars*CAR;const t={lane:l,zf:zNear-len,len,cars,cols:Array.from({length:cars},()=>rint(0,TRAIN_COLS.length-1)),v:opt.v||0,ramp:!!opt.ramp,warn:0};W.trains.push(t);return t}
function addObs(type,l,z){W.obs.push({type,lane:l,z,hit:false});}
function coinLine(l,z0,z1,y){for(let z=z0;z>z1;z-=1.7)W.coins.push({x:LX(l),y:y==null?.75:y,z,t:false,fly:0});}
function coinArc(l,z,len,base){// arc centred on z (an obstacle)
 for(let k=-3;k<=3;k++){const f=k/3.5;W.coins.push({x:LX(l),y:(base||0)+.75+2.0*(1-f*f),z:z+k*len/7,t:false,fly:0})}}

function genSection(){
 const d=difficulty(),sp=G.speedTarget||16;
 const gap=Math.max(9,sp*.6);let z=W.genZ-gap;
 W.section++;
 let r=rnd();const sec=W.section;
 const freeLanes=[-1,0,1].filter(l=>!laneBusy(l,z-60,z));
 let open=freeLanes.length?pick(freeLanes):rint(-1,1);let end=z;
 const lanes=[-1,0,1];
 if(sec<3){r=.95}// easy start: coins only / barriers
 if(r<.30){// --- stationary trains with optional ramp
  const nT=rnd()<.35+d*.3?2:1;const opts=lanes.filter(l=>l!=open);const chosen=nT==2?opts:[pick(opts)];
  let maxLen=0;for(const l of chosen){if(!freeLanes.includes(l))continue;const cars=rint(1,d>.3?3:2);const ramp=rnd()<.5;
   const zn=z-(ramp?7.5:0)-rint(0,6);const t=addTrain(l,zn,cars,{ramp});maxLen=Math.max(maxLen,z-t.zf);
   if(ramp)coinLine(l,zn-1,t.zf+1,ROOF+.75);else if(rnd()<.5)coinLine(l,z+4,zn+4,.75)}
  // open lane: coins + maybe an obstacle
  if(rnd()<.35+d*.5&&maxLen>20&&freeLanes.includes(open)){const oz=z-maxLen*.5;const ty=pick(['hurdle','high']);addObs(ty,open,oz);if(ty=='hurdle')coinArc(open,oz,sp*.55);else coinLine(open,oz+6,oz-6,.5)}
  else coinLine(open,z,z-Math.max(14,maxLen*.6));
  end=z-Math.max(maxLen,20);
 }else if(r<.52){// --- barrier rows
  const rows=rint(1,d>.4?3:2);let zz=z;
  for(let k=0;k<rows;k++){const safe=freeLanes.length?pick(freeLanes):rint(-1,1);for(const l of lanes){if(!freeLanes.includes(l)&&l!=safe)continue;
    let ty=l==safe?pick(['hurdle','high','none']):pick(['hurdle','high','block','block']);if(ty=='none'){coinLine(l,zz+5,zz-5);continue}
    if(!freeLanes.includes(l))continue;addObs(ty,l,zz);if(ty=='hurdle'&&rnd()<.6)coinArc(l,zz,sp*.55)}
   zz-=sp*.8+6}
  end=zz;
 }else if(r<.68&&d>.12){// --- oncoming train
  const ml=freeLanes.length?pick(freeLanes):open;const cars=rint(1,d>.5?3:2);const vt=8+d*6;
  // meet the player around the section's middle
  const meet=z-10,dist=G.z-meet,T=dist/Math.max(sp,1);const front=meet-vt*T;
  const t=addTrain(ml,front,cars,{v:vt});
  const other=lanes.filter(l=>l!=ml);const blockL=rnd()<.5?pick(other):null;
  if(blockL!=null&&freeLanes.includes(blockL)){addTrain(blockL,z,rint(1,2),{ramp:rnd()<.4})}
  const freeL=other.filter(l=>l!=blockL);for(const l of freeL)coinLine(l,z,z-22);
  end=z-30;
 }else if(r<.80&&d>.25&&freeLanes.length==3){// --- train wall, one ramp (take the high road)
  const rl=rint(-1,1);const cars=rint(2,3);for(const l of lanes){const zn=l==rl?z-7.5:z-7.5;const t=addTrain(l,zn,cars,{ramp:l==rl});if(l==rl)coinLine(l,zn-1,t.zf+1,ROOF+.75)}
  coinLine(rl,z+6,z-6,.75);end=z-7.5-cars*CAR;
 }else{// --- coins & light obstacles
  const l=open;const len=rint(26,44);coinLine(l,z,z-len);
  if(rnd()<.6){const oz=z-len*.5;const ty=pick(['hurdle','high']);const ol=pick(lanes.filter(x=>x!=l&&freeLanes.includes(x)).concat([l]));addObs(ty,ol,oz);if(ty=='hurdle'&&ol==l){W.coins=W.coins.filter(c=>!(c.x==LX(l)&&Math.abs(c.z-oz)<sp*.3));coinArc(l,oz,sp*.55)}}
  end=z-len;
 }
 // power-ups and boxes in a lane with nothing at that z
 const pz=(z+end)/2;
 if(W.lastPup-pz>260+rnd()*200&&sec>3){const l=bestFree(pz);if(l!=null){W.pups.push({type:pick(PUPS),lane:l,z:pz,y:1.1,t:false});W.lastPup=pz}}
 else if(W.lastBox-pz>350+rnd()*250&&sec>2){const l=bestFree(pz);if(l!=null){W.pups.push({type:'mbox',lane:l,z:pz,y:.4,t:false});W.lastBox=pz}}
 W.genZ=end;
}
function bestFree(z){const ok=[-1,0,1].filter(l=>!blocked(l,z,0));return ok.length?pick(ok):null}
function blocked(l,z,y){for(const t of W.trains)if(t.lane==l&&z>t.zf-4&&z<t.zf+t.len+(t.ramp?8:0)+4&&!t.v)return true;for(const o of W.obs)if(o.lane==l&&Math.abs(o.z-z)<4)return true;

}

const SFX=(()=>{let ac=null,mg,sg,musT=0,step=0,nextT=0,started=false;

 // music: simple hip-hop-ish loop, 4 bars
 const BASS=[0,0,7,0,5,5,3,5,0,0,7,0,10,7,5,3],CH=[[0,3,7],[5,8,12],[3,7,10],[7,10,14]];
 function music(){if(!ac||SET.mus<=0.001)return;const bpm=G.state=='run'?100+Math.min(30,(G.speed-15)*1.6):86,sp=60/bpm/2;
  while(nextT<ac.currentTime+.2){const t=Math.max(nextT,ac.currentTime);const s=step%16,bar=(step>>4)%4,root=45;
   if(s%4==0)tone(110,.18,'sine',.5,40,mg,t);// kick

 if(G.state=='run'){if(st.l&&!gpPrev.l)act('left');if(st.r&&!gpPrev.r)act('right');if(st.u&&!gpPrev.u)act('jump');if(st.d&&!gpPrev.d)act('roll');if(st.bo&&!gpPrev.bo)act('board');if(st.s&&!gpPrev.s)pauseGame()}
 else if(st.u&&!gpPrev.u&&(G.state=='menu'||G.state=='over'))(G.state=='menu'?$('bPlay'):$('bAgain')).click();
 gpPrev=st;break}}
addEventListener('blur',()=>pauseGame());document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
// loop
let last=performance.now(),acc=0,fpsN=0,fpsT=0,slow=0;const STEP=1/120;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);
 fpsN++;fpsT+=dt;if(fpsT>=1){if(SET.fps)$('fps').textContent=fpsN+' fps · '+cv.width+'x'+cv.height;
  if(G.state=='run'&&SET.gfx=='auto'&&!navigator.webdriver){if(fpsN<40){slow++;if(slow>=2&&renderScale>.5){renderScale=Math.max(.5,renderScale-.15);slow=0}}else if(fpsN>57&&renderScale<(SET.q?1:.7)){renderScale=Math.min(SET.q?1:.7,renderScale+.05)}}
  fpsN=0;fpsT=0}}
function tick(dt){pollPad();
 if(G.state=='run'){acc+=dt;while(acc>=STEP){stepPlayer(STEP);updateWorld(STEP);acc-=STEP;if(G.state!='run')break}misUpdate(true);UI.updHud()}
 else if(G.state=='crash'||G.state=='saveme'){stepCrash(dt);acc=0}
 else if(G.state=='menu'){G.anim+=dt*2;acc=0}
 else acc=0;
 stepParts(dt);SFX.music();render(dt)}
initRender();bindUI();UI.menu();renderScale=SET.q?1:.7;$('fps').hidden=!SET.fps;
// menu backdrop: a few trains around the idle runner
resetWorld();_seed=7;G.z=0;addTrain(-1,30,2,{});addTrain(1,44,3,{ramp:true});coinLine(0,34,5);W.obs.push({type:'hurdle',lane:0,z:40});G.speed=0;
requestAnimationFrame(frame);
window.__rr={G,W,SAVE,stepPlayer,updateWorld,act,startRun,beginRun,render,tick,UI};
